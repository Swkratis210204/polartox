[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polartox"
version = "0.6.0"
description = "NLP toolkit for annotator polarization research: synthetic data generation, Polarized Trees, and hyperparameter benchmarking"
readme = "PYPI_README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "SwkratisCS", email = "swkratisgiannoutsos@gmail.com" }
]
keywords = [
    "polarization",
    "annotation",
    "synthetic data",
    "nlp",
    "disagreement",
    "crowdsourcing",
    "demographics",
    "polarized trees",
    "hyperparameter optimization",
    "model selection"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "pandas",
    "ndfu",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://swkratis210204.github.io/polartox/"
Repository = "https://github.com/Swkratis210204/polartox"

[tool.setuptools.packages.find]
where = ["."]
include = ["polartox*"]